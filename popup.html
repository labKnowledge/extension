<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuietView</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>QuietView</h1>
      <p id="originLabel" class="origin">Loading...</p>

      <section class="panel">
        <h2>Pick on page</h2>
        <div class="mode-row">
          <label for="hideModeSelect">Hide mode</label>
          <select id="hideModeSelect">
            <option value="displayNone">Display none</option>
            <option value="visibilityHidden">Visibility hidden</option>
          </select>
        </div>
        <div class="row">
          <button id="startPickerBtn">Start picker</button>
          <button id="cancelPickerBtn" class="secondary">Cancel</button>
        </div>
      </section>

      <section class="panel">
        <h2>Add by selector</h2>
        <input id="selectorInput" type="text" placeholder='e.g. [data-testid="chatlist-header"]' />
        <button id="addSelectorBtn">Add selector rule</button>
      </section>

      <section class="panel">
        <h2>Add by pasted HTML</h2>
        <textarea id="snippetInput" placeholder="Paste a target HTML element snippet here..."></textarea>
        <button id="addSnippetBtn">Add snippet rule</button>
      </section>

      <section class="panel">
        <h2>Rules</h2>
        <div class="row">
          <button id="exportRulesBtn" class="secondary">Export JSON</button>
          <button id="importRulesBtn" class="secondary">Import JSON</button>
          <input id="importRulesFile" type="file" accept="application/json" hidden />
        </div>
        <div id="rulesList" class="rules"></div>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
